<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AdLib</title>
<style>
  /* One theme (design doc §2): background, backdrop treatment and motion, all as variables. */
  :root {
    --bg: #000;            /* pure black: matches the notch band macOS paints in full screen */
    --backdrop-blur: 70px;
    --backdrop-dim: 0.22;
    --backdrop-sat: 1.25;
    --vignette: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0.75) 100%);
    --drift-scale: 1.035;   /* slow zoom over a held image */
    --drift-ms: 9000ms;
    --enter-scale: 1.015;   /* new image settles into place while it fades in */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  .slot { position: absolute; inset: 0; opacity: 0; overflow: hidden; transition-property: opacity; transition-timing-function: cubic-bezier(.4, 0, .2, 1); }
  .slot.on { opacity: 1; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slot .bg { object-fit: cover; filter: blur(var(--backdrop-blur)) brightness(var(--backdrop-dim)) saturate(var(--backdrop-sat)); transform: scale(1.25); }
  .slot .vig { position: absolute; inset: 0; background: var(--vignette); pointer-events: none; }
  .slot .fg { object-fit: cover; transform-origin: 50% 45%; }
  .slot.fit .fg { object-fit: contain; filter: drop-shadow(0 3vh 7vh rgba(0,0,0,0.85)); }
  .slot.fit .fg { inset: 5vh 5vw; width: 90vw; height: 90vh; }
  .slot:not(.fit) .bg, .slot:not(.fit) .vig { display: none; }
  .slot.on .fg { animation: drift var(--drift-ms) ease-out forwards; }
  @keyframes drift { from { transform: scale(var(--enter-scale)); } 15% { transform: scale(1); } to { transform: scale(var(--drift-scale)); } }

  /* Before the first image: a quiet "listening" dot, gone once anything renders. */
  #idle { position: absolute; left: 50%; bottom: 7vh; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
          background: rgba(255,255,255,0.35); animation: breathe 2.4s ease-in-out infinite; transition: opacity 600ms; }
  #idle.gone { opacity: 0; animation: none; }
  #idle.err { background: rgba(255,90,90,0.8); animation: none; }
  @keyframes breathe { 0%, 100% { transform: scale(0.8); opacity: 0.35; } 50% { transform: scale(1.15); opacity: 0.8; } }

  /* Presenter safety valve: `b` blanks to the background colour. */
  #blank { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 250ms; z-index: 5; }
  #blank.on { opacity: 1; }

  /* Stretch goal: the "deck" that built itself — every image shown, in order. */
  #grid { position: absolute; inset: 0; display: grid; gap: 1.4vw; padding: 5vw; box-sizing: border-box; z-index: 4;
          background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 500ms ease;
          grid-template-columns: repeat(auto-fill, minmax(17vw, 1fr)); align-content: center; }
  #grid.on { opacity: 1; }
  #grid img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 0.7vw;
              box-shadow: 0 1vh 3vh rgba(0,0,0,0.5); opacity: 0; transform: translateY(1.5vh);
              transition: opacity 400ms ease, transform 400ms ease; }
  #grid.on img { opacity: 1; transform: none; }

  /* ---------- Canvas mode (CANVAS.md): an evolving board of up to 4 tiles + annotations ---------- */
  #board { position: absolute; inset: 0; }
  .tile { position: absolute; overflow: hidden; border-radius: 1.4vh; box-shadow: 0 2.2vh 6vh rgba(0,0,0,0.65);
          opacity: 0; transform: scale(0.94);
          transition: left 520ms cubic-bezier(.2,.8,.2,1), top 520ms cubic-bezier(.2,.8,.2,1), width 520ms cubic-bezier(.2,.8,.2,1),
                      height 520ms cubic-bezier(.2,.8,.2,1), opacity 380ms ease, transform 520ms cubic-bezier(.2,.8,.2,1), filter 400ms ease; }
  .tile.on { opacity: 1; transform: none; }
  .tile.full { border-radius: 0; box-shadow: none; }
  .tile.dim { filter: brightness(0.62) saturate(0.85); }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .bg { filter: blur(var(--backdrop-blur)) brightness(var(--backdrop-dim)) saturate(var(--backdrop-sat)); transform: scale(1.25); display: none; }
  .tile.fit .bg { display: block; }
  .tile.fit .fg { object-fit: contain; inset: 4vh 4vw; width: calc(100% - 8vw); height: calc(100% - 8vh); filter: drop-shadow(0 3vh 7vh rgba(0,0,0,0.85)); }
  .tile.full.on .fg { animation: drift var(--drift-ms) ease-out forwards; transform-origin: 50% 45%; }
  .tile .ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 300ms; }
  .tile.hl .ring { opacity: 1; box-shadow: inset 0 0 0 0.55vh rgba(255,210,90,0.95), 0 0 5vh rgba(255,210,90,0.45); animation: pulse 1.8s ease-in-out 2; }
  .tile.fr .ring { opacity: 1; box-shadow: inset 0 0 0 0.35vh rgba(255,255,255,0.9); }
  @keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 0.55vh rgba(255,210,90,0.95), 0 0 3vh rgba(255,210,90,0.3); }
                     50% { box-shadow: inset 0 0 0 0.8vh rgba(255,224,140,1), 0 0 7vh rgba(255,210,90,0.7); } }
  .chip { position: absolute; left: 1.6vh; bottom: 1.6vh; padding: 0.7vh 1.4vh; border-radius: 99px; font: 600 2.1vh/1.2 -apple-system, "SF Pro Display", sans-serif;
          color: #111; background: rgba(255,214,110,0.95); box-shadow: 0 0.8vh 2vh rgba(0,0,0,0.4); opacity: 0; transform: translateY(1vh); transition: opacity 300ms, transform 300ms; }
  .chip.on { opacity: 1; transform: none; }
  #ann { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  body:not(.sketch) #ann path { fill: none; stroke: rgba(255,214,110,0.95); stroke-width: 0.5vh; stroke-linecap: round; filter: drop-shadow(0 0.4vh 1vh rgba(0,0,0,0.6));
              stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 700ms ease-out forwards; }
  body:not(.sketch) #ann text { fill: #fff; font: 600 2.2vh -apple-system, sans-serif; paint-order: stroke; stroke: rgba(0,0,0,0.7); stroke-width: 0.5vh; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Diagram / chart tiles (sketch.js, "slate" skin): clean vector on a deep slate card. */
  .tile.gfx { background: radial-gradient(130% 120% at 12% 0%, #1b2436 0%, #0d121c 55%, #07090e 100%);
              box-shadow: 0 2.2vh 6vh rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.07); }
  .tile.gfx.full { box-shadow: none; }
  .tile.gfx svg.g { position: absolute; inset: 0; width: 100%; height: 100%; }
  body:not(.sketch) .g text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }

  /* Logo / icon / flag tiles and plain name cards: the symbol on its own, no photo frame. */
  .tile.logo .lg { position: absolute; inset: 6%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh; }
  .tile.logo .lg img { position: static; inset: auto; width: auto; height: auto; max-width: 74%; max-height: 64%; object-fit: contain; flex: 0 1 auto; }
  .tile.logo .lg .cap { font: 700 3.4vh/1.1 "Noteworthy", "Chalkboard SE", "Marker Felt", cursive; color: #2b2723; text-align: center; }
  .tile.logo .lg .word { font: 700 9vh/1.05 "Noteworthy", "Chalkboard SE", "Marker Felt", cursive; color: #2b2723; text-align: center; padding: 0 4vw; overflow-wrap: anywhere; }
  .tile.logo .lg .cap:empty, .tile.logo .lg .word:empty { display: none; }
  .tile.logo.full .lg img { max-width: 52%; max-height: 62%; }
  /* Zoom (layout "hero"): the focused tile is the big one, and its picture grows too. A lone tile has no neighbours to
     outgrow, so its picture scales up instead. */
  .tile .fg { transition: scale 600ms cubic-bezier(.2,.8,.2,1); }
  .tile.logo.zoom .lg img { max-width: 86%; max-height: 74%; }
  .tile.logo.zoom.full .lg img { max-width: 72%; max-height: 76%; }
  .tile.logo.zoom .lg .word { font-size: 12vh; }
  .tile.full.zoom:not(.gfx):not(.logo) .fg { scale: 1.1; }
  body:not(.sketch) .tile.logo { background: radial-gradient(130% 120% at 12% 0%, #1b2436 0%, #0d121c 55%, #07090e 100%); box-shadow: 0 2.2vh 6vh rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.07); }
  body:not(.sketch) .tile.logo .lg .cap, body:not(.sketch) .tile.logo .lg .word { color: #f1f3f7; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  body.sketch .tile.logo { background: transparent; box-shadow: none; }

  /* ---------- "Live sketch" theme (LS_THEME=sketch, default): warm paper, taped photos, hand-drawn graphics ---------- */
  body.sketch { --bg: #efe6d3; background: var(--bg); }
  /* paper: warm vignette with fibre grain multiplied in (as a background, so it never covers the tiles) */
  body.sketch #board { background-color: #f4ecdc; background-blend-mode: multiply, normal;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .47 0 0 0 0 .34 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(130% 100% at 50% 30%, #fcf8f0 0%, #f4ecdc 55%, #e6d9bf 100%); }
  body.sketch .tile { overflow: visible; border-radius: 0; box-shadow: none; background: transparent; z-index: 1; }
  body.sketch .tile.dim { filter: saturate(0.7) opacity(0.75); }
  body.sketch .tile.gfx { background: transparent; box-shadow: none; }
  body.sketch .pol { position: absolute; inset: 5%; background: #fffdf7; padding: 2.4% 2.4% 0 2.4%; box-sizing: border-box;
    box-shadow: 0 1.4vh 3.2vh rgba(70,48,18,0.28), 0 0.25vh 0.6vh rgba(70,48,18,0.22); transform: rotate(var(--rot, 0deg));
    transition: transform 600ms cubic-bezier(.2,.8,.2,1), scale 600ms cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
  body.sketch .tile.full .pol { inset: 7vh 14vw; }
  body.sketch .tile.full.zoom .pol { scale: 1.08; }
  body.sketch .pol .ph { position: relative; flex: 1; overflow: hidden; background: #ddd; }
  body.sketch .pol .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.92) contrast(1.02) sepia(0.06); }
  body.sketch .pol .cap { height: 5.2vh; display: flex; align-items: center; justify-content: center; color: #2b2723;
    font: 700 3vh/1 "Noteworthy", "Chalkboard SE", "Marker Felt", cursive; white-space: nowrap; overflow: hidden; }
  body.sketch .tile.full .pol .cap { height: 8vh; font-size: 4.2vh; }
  body.sketch .pol .tape { position: absolute; top: -2.1vh; left: 50%; width: 15vh; height: 4.2vh; margin-left: -7.5vh; transform: rotate(var(--tape, -3deg));
    background: linear-gradient(180deg, rgba(238,224,172,0.92), rgba(226,208,150,0.88)); box-shadow: 0 0.25vh 0.6vh rgba(70,48,18,0.18);
    clip-path: polygon(0 8%, 4% 0, 9% 10%, 14% 2%, 20% 9%, 26% 0, 33% 7%, 40% 1%, 47% 9%, 54% 0, 61% 8%, 68% 1%, 75% 9%, 82% 0, 88% 8%, 94% 1%, 100% 9%,
      100% 92%, 95% 100%, 89% 91%, 83% 99%, 76% 90%, 70% 100%, 63% 92%, 56% 100%, 49% 91%, 42% 99%, 35% 90%, 28% 100%, 21% 92%, 14% 100%, 7% 91%, 0 99%); }
  body.sketch .tile .mark { position: absolute; inset: -4%; width: 108%; height: 108%; pointer-events: none; overflow: visible; z-index: 3; }
  body.sketch .tile .ring, body.sketch .tile .chip { display: none; }
  body.sketch #idle { background: rgba(43,39,35,0.35); }
</style>
</head>
<body>
<div class="slot" id="a"><img class="bg"><div class="vig"></div><img class="fg"></div>
<div class="slot" id="b"><img class="bg"><div class="vig"></div><img class="fg"></div>
<div id="board"></div>
<svg id="ann"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" style="fill: rgba(255,214,110,0.95); stroke: none; animation: none; stroke-dasharray: none"/></marker></defs><g id="annG"></g></svg>
<div id="idle"></div>
<div id="grid"></div>
<div id="blank"></div>
<script src="textfit.js"></script>
<script src="sketch.js"></script>
<script>
  // Browser preview (no Tauri): `python3 -m http.server -d app/dist` → push scenes with window.__scene(sc).
  if (!window.__TAURI__) {
    const handlers = {};
    window.__TAURI__ = {
      event: { listen: (name, cb) => { handlers[name] = cb; return Promise.resolve(); } },
      core: { invoke: cmd => Promise.resolve(cmd === 'app_state' ? { mode: 'canvas', phase: 'listening', theme: new URLSearchParams(location.search).get('theme') || 'sketch' } : null) },
      window: { getCurrentWindow: () => ({ setFullscreen: async () => {}, isFullscreen: async () => false }) },
    };
    window.__scene = sc => handlers.scene && handlers.scene({ payload: sc });
    document.write('<script src="preview.js"><\/script>');
  }
  // Presentation only: every decision is made in Rust. See design doc §2.
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const $ = id => document.getElementById(id);
  const slots = [$('a'), $('b')];
  let front = 0, token = 0;
  const shown = []; // image URLs in the order they appeared

  const fe = (step, chunkId, ms, detail) => invoke('fe', { step, chunkId, ms, detail }).catch(() => {});
  window.addEventListener('error', e => fe('js_error', null, null, String(e.message)));
  // rAF stalls when the window is hidden/display asleep; fall back to a timer so "painted" still reports.
  const afterPaint = cb => { let done = false; const f = () => { if (!done) { done = true; cb(); } };
    requestAnimationFrame(() => requestAnimationFrame(f)); setTimeout(f, 100); };

  function place(slot, rect) {
    Object.assign(slot.style, { left: rect.x * 100 + '%', top: rect.y * 100 + '%',
      width: rect.w * 100 + '%', height: rect.h * 100 + '%', inset: 'auto' });
  }

  function toggleGrid(on) {
    const g = $('grid');
    if (on) {
      // Enough columns that every image fits on one screen (≈16:10 tiles).
      const cols = Math.max(3, Math.ceil(Math.sqrt(shown.length * 1.4 * innerWidth / innerHeight / 1.6)));
      g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      g.innerHTML = '';
      shown.forEach((u, i) => { const im = document.createElement('img'); im.src = u; im.style.transitionDelay = (i * 60) + 'ms'; g.appendChild(im); });
    }
    g.classList.toggle('on', on);
  }

  let theme = 'slate';
  function applyState(s) {
    if (s.mode) mode = s.mode;
    if (s.theme && s.theme !== theme) { theme = s.theme; document.body.classList.toggle('sketch', theme === 'sketch'); if (lastScene) renderScene(lastScene); }
    if (typeof s.blank === 'boolean') $('blank').classList.toggle('on', s.blank);
    const idle = $('idle');
    idle.classList.toggle('err', s.phase === 'error');
    if (shown.length) idle.classList.add('gone');
  }

  async function show(ev, received) {
    const my = ++token;
    const fadeMs = ev.kind === 'update' ? 150 : 300;
    const cur = slots[front], next = slots[1 - front];
    if (ev.kind === 'clear' || !ev.url) {
      cur.style.transitionDuration = fadeMs + 'ms';
      cur.classList.remove('on');
      afterPaint(() => fe('painted', ev.chunk_id, performance.now() - received, ev.kind));
      return;
    }
    const fg = next.querySelector('.fg'), bg = next.querySelector('.bg');
    const t0 = performance.now();
    fg.src = ev.url; bg.src = ev.url;
    try { await fg.decode(); } catch (e) { fe('decode_error', ev.chunk_id, null, ev.url + ' ' + e); return; }
    if (my !== token) return; // a newer event arrived while decoding
    fe('decoded', ev.chunk_id, performance.now() - t0, ev.url);
    if (shown[shown.length - 1] !== ev.url) shown.push(ev.url);
    $('idle').classList.add('gone');
    // Photos close to the screen's shape fill it; anything else is framed over its own blurred copy.
    const imgAspect = fg.naturalWidth / fg.naturalHeight, scrAspect = innerWidth / innerHeight;
    next.classList.toggle('fit', Math.abs(imgAspect / scrAspect - 1) > 0.15);
    place(next, ev.rect);
    next.style.transitionDuration = cur.style.transitionDuration = fadeMs + 'ms';
    // Restart the drift animation on the incoming image.
    fg.style.animation = 'none'; void fg.offsetWidth; fg.style.animation = '';
    next.classList.add('on');
    cur.classList.remove('on');
    front = 1 - front;
    afterPaint(() => fe('painted', ev.chunk_id, performance.now() - received, ev.kind));
  }


  // ---------- Canvas mode ----------
  let mode = 'single';
  const tiles = new Map(); // element id → {div, url, seen, sig}
  let lastScene = null;
  function pct(v) { return (v * 100).toFixed(3) + '%'; }
  function setRect(div, r) { Object.assign(div.style, { left: pct(r.x), top: pct(r.y), width: pct(r.w), height: pct(r.h) }); }
  async function renderScene(sc) {
    lastScene = sc;
    const t0 = performance.now();
    const n = sc.elements.length;
    const keep = new Set(sc.elements.map(e => e.id));
    for (const [id, t] of tiles) if (!keep.has(id)) {           // removed → fade out
      t.div.classList.remove('on'); setTimeout(() => t.div.remove(), 450); tiles.delete(id);
    }
    const board = $('board');
    for (const e of sc.elements) {
      let t = tiles.get(e.id);
      const gfx = e.kind === 'diagram' || e.kind === 'chart' || e.kind === 'text';
      const logo = e.kind === 'logo';
      const sketch = theme === 'sketch';
      if (t && t.sketch !== sketch) { t.div.remove(); tiles.delete(e.id); t = null; }   // theme switched
      if (!t) {
        const div = document.createElement('div'); div.className = gfx ? 'tile gfx' : logo ? 'tile logo' : 'tile';
        if (logo) div.innerHTML = '<div class="lg"><img class="fg"><div class="word"></div><div class="cap"></div></div><svg class="mark"></svg><div class="ring"></div><div class="chip"></div>';
        else if (gfx) div.innerHTML = '<svg class="g"></svg><svg class="mark"></svg><div class="ring"></div><div class="chip"></div>';
        else if (sketch) {
          // A photo taped onto the page: tilt and tape angle are seeded by the element id (stable across renders).
          const r = Sketch.rng(e.id);
          div.innerHTML = '<div class="pol"><div class="ph"><img class="fg"></div><div class="cap"></div><div class="tape"></div></div><svg class="mark"></svg><div class="ring"></div><div class="chip"></div>';
          div.style.setProperty('--rot', ((r() - 0.5) * 5).toFixed(2) + 'deg');
          div.style.setProperty('--tape', ((r() - 0.5) * 9).toFixed(2) + 'deg');
        } else div.innerHTML = '<img class="bg"><img class="fg"><div class="ring"></div><div class="chip"></div>';
        setRect(div, e.rect); board.appendChild(div);
        t = { div, url: '', seen: new Set(), sig: '', sketch, mark: '' }; tiles.set(e.id, t);
      }
      if (gfx) {
        // Drawn for the tile's final size; the SVG scales smoothly while the tile animates there.
        const W = e.rect.w * innerWidth, H = e.rect.h * innerHeight;
        const sig = JSON.stringify([e.diagram || e.chart || e.text, Math.round(W), Math.round(H)]);
        if (sig !== t.sig) { t.sig = sig; try { Sketch.render(t.div.querySelector('svg.g'), e, W, H, t.seen, n === 1, sketch ? 'sketch' : 'slate'); } catch (err) { fe('js_error', sc.chunk_id, null, 'gfx ' + err); } }
        t.div.classList.toggle('full', n === 1);
        t.div.classList.toggle('dim', sc.layout === 'hero' && !e.focus && n > 1);
        t.div.classList.toggle('zoom', sc.layout === 'hero' && e.focus);
        t.div.style.zIndex = e.focus ? 2 : 1;
        setRect(t.div, e.rect);
        requestAnimationFrame(() => t.div.classList.add('on'));
        continue;
      }
      if (logo) {
        // The symbol's image (an <img> of the SVG) with its name under it, or just the name when the library had nothing.
        const key = e.url + '|' + e.caption;
        if (t.url !== key) {
          const img = t.div.querySelector('.lg img'), word = t.div.querySelector('.word'), cap = t.div.querySelector('.cap');
          if (e.url) {
            const pre = new Image(); pre.src = e.url;
            try { await pre.decode(); } catch (_) {}
            img.src = e.url; img.style.display = ''; word.textContent = ''; cap.textContent = e.caption || '';
          } else { img.removeAttribute('src'); img.style.display = 'none'; word.textContent = e.caption || ''; cap.textContent = ''; }
          t.url = key;
          if (e.focus && t.div.classList.contains('on')) { t.div.animate([{ filter: 'brightness(1.4)' }, { filter: 'none' }], { duration: 350 }); }
        }
        t.div.classList.toggle('full', n === 1);
        t.div.classList.toggle('dim', sc.layout === 'hero' && !e.focus && n > 1);
        t.div.classList.toggle('zoom', sc.layout === 'hero' && e.focus);
        t.div.style.zIndex = e.focus ? 2 : 1;
        setRect(t.div, e.rect);
        requestAnimationFrame(() => t.div.classList.add('on'));
        continue;
      }
      const fg = t.div.querySelector('.fg'), bg = t.div.querySelector('.bg');
      if (t.url !== e.url) {
        const pre = new Image(); pre.src = e.url;
        try { await pre.decode(); } catch (_) {}
        fg.src = e.url; if (bg) bg.src = e.url; t.url = e.url;
        const cap = t.div.querySelector('.cap'); if (cap) cap.textContent = (e.caption || '').replace(/\s*\(.*\)\s*$/, '');
        if (shown[shown.length - 1] !== e.url && !shown.includes(e.url)) shown.push(e.url);
        if (e.focus && t.div.classList.contains('on')) { t.div.animate([{ filter: 'brightness(1.6)' }, { filter: 'none' }], { duration: 350 }); }
      }
      const full = n === 1;
      t.div.classList.toggle('full', full);
      const ia = (fg.naturalWidth || 16) / (fg.naturalHeight || 9), ta = (e.rect.w * innerWidth) / (e.rect.h * innerHeight);
      t.div.classList.toggle('fit', !sketch && full && Math.abs(ia / ta - 1) > 0.15);
      t.div.classList.toggle('dim', sc.layout === 'hero' && !e.focus && n > 1);
      t.div.classList.toggle('zoom', sc.layout === 'hero' && e.focus);
      t.div.style.zIndex = e.focus ? 2 : 1;
      setRect(t.div, e.rect);
      requestAnimationFrame(() => t.div.classList.add('on'));
    }
    // annotations: highlight/frame on tiles (+ label chip), arrows as SVG paths between tile centres
    for (const [, t] of tiles) { t.div.classList.remove('hl', 'fr'); t.div.querySelector('.chip').classList.remove('on'); }
    const g = $('annG'); g.innerHTML = '';
    if (theme === 'sketch') {
      // Marker circle around a highlighted tile, hand-drawn arrows between tiles; only new marks draw in.
      const want = new Map();
      for (const a of sc.annotations) if (a.kind !== 'arrow') for (const id of a.targets) want.set(id, a);
      const rectOf = Object.fromEntries(sc.elements.map(e => [e.id, e.rect]));
      for (const [id, t] of tiles) {
        const m = t.div.querySelector('svg.mark'); if (!m) continue;
        const a = want.get(id), r = rectOf[id];
        // Sized from the tile's new rect: offsetWidth still reads the old size while the tile animates to its place (zoom,
        // a new tile), which left the circle the wrong size. A resized tile re-fits the same circle without redrawing it in.
        const W = r ? r.w * innerWidth * 1.08 : 0, H = r ? r.h * innerHeight * 1.08 : 0;
        const what = a ? a.id + '|' + (a.label || '') : '';
        const key = a ? what + '|' + Math.round(W) + 'x' + Math.round(H) : '';
        if (key !== t.mark) {
          if (a) Sketch.circleAround(m, a.id, W, H, a.label, t.markWhat !== what); else m.innerHTML = '';
          t.mark = key; t.markWhat = what;
        }
      }
      const byId = Object.fromEntries(sc.elements.map(e => [e.id, e]));
      for (const a of sc.annotations) {
        if (a.kind !== 'arrow' || a.targets.length < 2 || !byId[a.targets[0]] || !byId[a.targets[1]]) continue;
        const A = byId[a.targets[0]].rect, B = byId[a.targets[1]].rect;
        const fresh = !(renderScene.drawn || (renderScene.drawn = new Set())).has(a.id); renderScene.drawn.add(a.id);
        Sketch.arrowBetween(g, a.id, (A.x + A.w / 2) * innerWidth, (A.y + A.h * 0.2) * innerHeight, (B.x + B.w / 2) * innerWidth, (B.y + B.h * 0.2) * innerHeight,
          Math.max(12, innerHeight * 0.02), a.label, fresh);
      }
      if (n) $('idle').classList.add('gone');
      afterPaint(() => fe('scene_painted', sc.chunk_id, performance.now() - t0, `v${sc.version} ${sc.reason}`));
      return;
    }
    const byId = Object.fromEntries(sc.elements.map(e => [e.id, e]));
    for (const a of sc.annotations) {
      if (a.kind === 'arrow' && a.targets.length >= 2 && byId[a.targets[0]] && byId[a.targets[1]]) {
        const A = byId[a.targets[0]].rect, B = byId[a.targets[1]].rect;
        const ax = (A.x + A.w / 2) * innerWidth, ay = (A.y + A.h / 2) * innerHeight, bx = (B.x + B.w / 2) * innerWidth, by = (B.y + B.h / 2) * innerHeight;
        const mx = (ax + bx) / 2, my = Math.min(ay, by) - innerHeight * 0.08;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', `M${ax},${ay} Q${mx},${my} ${bx},${by}`); p.setAttribute('marker-end', 'url(#head)'); g.appendChild(p);
        if (a.label) { const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text'); tx.setAttribute('x', mx); tx.setAttribute('y', my); tx.setAttribute('text-anchor', 'middle'); tx.textContent = a.label; g.appendChild(tx); }
      } else {
        for (const id of a.targets) {
          const t = tiles.get(id); if (!t) continue;
          t.div.classList.add(a.kind === 'frame' ? 'fr' : 'hl');
          if (a.label) { const c = t.div.querySelector('.chip'); c.textContent = a.label; c.classList.add('on'); }
        }
      }
    }
    if (n) $('idle').classList.add('gone');
    afterPaint(() => fe('scene_painted', sc.chunk_id, performance.now() - t0, `v${sc.version} ${sc.reason}`));
  }
  listen('scene', e => { if (mode === 'canvas') renderScene(e.payload); });
  let resizeT = 0;
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => lastScene && renderScene(lastScene), 150); });
  listen('session_reset', () => {
    token++;
    for (const [, t] of tiles) t.div.remove();
    tiles.clear(); lastScene = null; shown.length = 0;
    renderScene.drawn = new Set();
    $('annG').innerHTML = ''; $('grid').innerHTML = ''; toggleGrid(false);
    for (const slot of slots) { slot.classList.remove('on'); slot.querySelectorAll('img').forEach(img => img.removeAttribute('src')); }
    $('idle').classList.remove('gone', 'err'); $('blank').classList.remove('on');
  });
  listen('state', e => applyState(e.payload));
  listen('operator_blank', e => { $('blank').classList.toggle('on', !!e.payload); fe('blank', null, null, String(!!e.payload)); });
  // Canvas mode: the board itself is the summary (it holds diagrams and charts the photo grid can't show).
  listen('talk_end', () => { if (mode === 'canvas') return; toggleGrid(true); fe('grid', null, shown.length, 'talk_end'); });
  listen('render', e => { const t = performance.now(); fe('received', e.payload.chunk_id, 0, e.payload.kind); if (mode !== 'canvas') show(e.payload, t); });
  invoke('app_state').then(applyState).catch(() => {});
  fe('loaded', null, null, location.href);

  document.addEventListener('keydown', async e => {
    const w = window.__TAURI__.window.getCurrentWindow();
    if (e.key === 'b') { $('blank').classList.toggle('on'); fe('blank', null, null, String($('blank').classList.contains('on'))); }
    else if (e.key === 'g') toggleGrid(!$('grid').classList.contains('on'));
    else if (e.key === 'f') await w.setFullscreen(!(await w.isFullscreen()));
    else if (e.key === 'Escape') await w.setFullscreen(false);
  });
</script>
</body>
</html>
