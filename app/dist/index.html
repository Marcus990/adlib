<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Live Slides</title>
<style>
  /* One theme (design doc §2): background, backdrop treatment and motion, all as variables. */
  :root {
    --bg: #000;            /* pure black: matches the notch band macOS paints in full screen */
    --backdrop-blur: 70px;
    --backdrop-dim: 0.22;
    --backdrop-sat: 1.25;
    --vignette: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0.75) 100%);
    --drift-scale: 1.035;   /* slow zoom over a held image */
    --drift-ms: 9000ms;
    --enter-scale: 1.015;   /* new image settles into place while it fades in */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  .slot { position: absolute; inset: 0; opacity: 0; overflow: hidden; transition-property: opacity; transition-timing-function: cubic-bezier(.4, 0, .2, 1); }
  .slot.on { opacity: 1; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slot .bg { object-fit: cover; filter: blur(var(--backdrop-blur)) brightness(var(--backdrop-dim)) saturate(var(--backdrop-sat)); transform: scale(1.25); }
  .slot .vig { position: absolute; inset: 0; background: var(--vignette); pointer-events: none; }
  .slot .fg { object-fit: cover; transform-origin: 50% 45%; }
  .slot.fit .fg { object-fit: contain; filter: drop-shadow(0 3vh 7vh rgba(0,0,0,0.85)); }
  .slot.fit .fg { inset: 5vh 5vw; width: 90vw; height: 90vh; }
  .slot:not(.fit) .bg, .slot:not(.fit) .vig { display: none; }
  .slot.on .fg { animation: drift var(--drift-ms) ease-out forwards; }
  @keyframes drift { from { transform: scale(var(--enter-scale)); } 15% { transform: scale(1); } to { transform: scale(var(--drift-scale)); } }

  /* Before the first image: a quiet "listening" dot, gone once anything renders. */
  #idle { position: absolute; left: 50%; bottom: 7vh; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
          background: rgba(255,255,255,0.35); animation: breathe 2.4s ease-in-out infinite; transition: opacity 600ms; }
  #idle.gone { opacity: 0; animation: none; }
  #idle.err { background: rgba(255,90,90,0.8); animation: none; }
  @keyframes breathe { 0%, 100% { transform: scale(0.8); opacity: 0.35; } 50% { transform: scale(1.15); opacity: 0.8; } }

  /* Presenter safety valve: `b` blanks to the background colour. */
  #blank { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 250ms; z-index: 5; }
  #blank.on { opacity: 1; }

  /* Stretch goal: the "deck" that built itself — every image shown, in order. */
  #grid { position: absolute; inset: 0; display: grid; gap: 1.4vw; padding: 5vw; box-sizing: border-box; z-index: 4;
          background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 500ms ease;
          grid-template-columns: repeat(auto-fill, minmax(17vw, 1fr)); align-content: center; }
  #grid.on { opacity: 1; }
  #grid img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 0.7vw;
              box-shadow: 0 1vh 3vh rgba(0,0,0,0.5); opacity: 0; transform: translateY(1.5vh);
              transition: opacity 400ms ease, transform 400ms ease; }
  #grid.on img { opacity: 1; transform: none; }

  /* ---------- Canvas mode (CANVAS.md): an evolving board of up to 4 tiles + annotations ---------- */
  #board { position: absolute; inset: 0; }
  .tile { position: absolute; overflow: hidden; border-radius: 1.4vh; box-shadow: 0 2.2vh 6vh rgba(0,0,0,0.65);
          opacity: 0; transform: scale(0.94);
          transition: left 520ms cubic-bezier(.2,.8,.2,1), top 520ms cubic-bezier(.2,.8,.2,1), width 520ms cubic-bezier(.2,.8,.2,1),
                      height 520ms cubic-bezier(.2,.8,.2,1), opacity 380ms ease, transform 520ms cubic-bezier(.2,.8,.2,1), filter 400ms ease; }
  .tile.on { opacity: 1; transform: none; }
  .tile.full { border-radius: 0; box-shadow: none; }
  .tile.dim { filter: brightness(0.62) saturate(0.85); }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .bg { filter: blur(var(--backdrop-blur)) brightness(var(--backdrop-dim)) saturate(var(--backdrop-sat)); transform: scale(1.25); display: none; }
  .tile.fit .bg { display: block; }
  .tile.fit .fg { object-fit: contain; inset: 4vh 4vw; width: calc(100% - 8vw); height: calc(100% - 8vh); filter: drop-shadow(0 3vh 7vh rgba(0,0,0,0.85)); }
  .tile.full.on .fg { animation: drift var(--drift-ms) ease-out forwards; transform-origin: 50% 45%; }
  .tile .ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 300ms; }
  .tile.hl .ring { opacity: 1; box-shadow: inset 0 0 0 0.55vh rgba(255,210,90,0.95), 0 0 5vh rgba(255,210,90,0.45); animation: pulse 1.8s ease-in-out 2; }
  .tile.fr .ring { opacity: 1; box-shadow: inset 0 0 0 0.35vh rgba(255,255,255,0.9); }
  @keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 0.55vh rgba(255,210,90,0.95), 0 0 3vh rgba(255,210,90,0.3); }
                     50% { box-shadow: inset 0 0 0 0.8vh rgba(255,224,140,1), 0 0 7vh rgba(255,210,90,0.7); } }
  .chip { position: absolute; left: 1.6vh; bottom: 1.6vh; padding: 0.7vh 1.4vh; border-radius: 99px; font: 600 2.1vh/1.2 -apple-system, "SF Pro Display", sans-serif;
          color: #111; background: rgba(255,214,110,0.95); box-shadow: 0 0.8vh 2vh rgba(0,0,0,0.4); opacity: 0; transform: translateY(1vh); transition: opacity 300ms, transform 300ms; }
  .chip.on { opacity: 1; transform: none; }
  #ann { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #ann path { fill: none; stroke: rgba(255,214,110,0.95); stroke-width: 0.5vh; stroke-linecap: round; filter: drop-shadow(0 0.4vh 1vh rgba(0,0,0,0.6));
              stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 700ms ease-out forwards; }
  #ann text { fill: #fff; font: 600 2.2vh -apple-system, sans-serif; paint-order: stroke; stroke: rgba(0,0,0,0.7); stroke-width: 0.5vh; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="slot" id="a"><img class="bg"><div class="vig"></div><img class="fg"></div>
<div class="slot" id="b"><img class="bg"><div class="vig"></div><img class="fg"></div>
<div id="board"></div>
<svg id="ann"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" style="fill: rgba(255,214,110,0.95); stroke: none; animation: none; stroke-dasharray: none"/></marker></defs><g id="annG"></g></svg>
<div id="idle"></div>
<div id="grid"></div>
<div id="blank"></div>
<script>
  // Presentation only: every decision is made in Rust. See design doc §2.
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const $ = id => document.getElementById(id);
  const slots = [$('a'), $('b')];
  let front = 0, token = 0;
  const shown = []; // image URLs in the order they appeared

  const fe = (step, chunkId, ms, detail) => invoke('fe', { step, chunkId, ms, detail }).catch(() => {});
  window.addEventListener('error', e => fe('js_error', null, null, String(e.message)));
  // rAF stalls when the window is hidden/display asleep; fall back to a timer so "painted" still reports.
  const afterPaint = cb => { let done = false; const f = () => { if (!done) { done = true; cb(); } };
    requestAnimationFrame(() => requestAnimationFrame(f)); setTimeout(f, 100); };

  function place(slot, rect) {
    Object.assign(slot.style, { left: rect.x * 100 + '%', top: rect.y * 100 + '%',
      width: rect.w * 100 + '%', height: rect.h * 100 + '%', inset: 'auto' });
  }

  function toggleGrid(on) {
    const g = $('grid');
    if (on) {
      // Enough columns that every image fits on one screen (≈16:10 tiles).
      const cols = Math.max(3, Math.ceil(Math.sqrt(shown.length * 1.4 * innerWidth / innerHeight / 1.6)));
      g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      g.innerHTML = '';
      shown.forEach((u, i) => { const im = document.createElement('img'); im.src = u; im.style.transitionDelay = (i * 60) + 'ms'; g.appendChild(im); });
    }
    g.classList.toggle('on', on);
  }

  function applyState(s) {
    if (s.mode) mode = s.mode;
    const idle = $('idle');
    idle.classList.toggle('err', s.phase === 'error');
    if (shown.length) idle.classList.add('gone');
  }

  async function show(ev, received) {
    const my = ++token;
    const fadeMs = ev.kind === 'update' ? 150 : 300;
    const cur = slots[front], next = slots[1 - front];
    if (ev.kind === 'clear' || !ev.url) {
      cur.style.transitionDuration = fadeMs + 'ms';
      cur.classList.remove('on');
      afterPaint(() => fe('painted', ev.chunk_id, performance.now() - received, ev.kind));
      return;
    }
    const fg = next.querySelector('.fg'), bg = next.querySelector('.bg');
    const t0 = performance.now();
    fg.src = ev.url; bg.src = ev.url;
    try { await fg.decode(); } catch (e) { fe('decode_error', ev.chunk_id, null, ev.url + ' ' + e); return; }
    if (my !== token) return; // a newer event arrived while decoding
    fe('decoded', ev.chunk_id, performance.now() - t0, ev.url);
    if (shown[shown.length - 1] !== ev.url) shown.push(ev.url);
    $('idle').classList.add('gone');
    // Photos close to the screen's shape fill it; anything else is framed over its own blurred copy.
    const imgAspect = fg.naturalWidth / fg.naturalHeight, scrAspect = innerWidth / innerHeight;
    next.classList.toggle('fit', Math.abs(imgAspect / scrAspect - 1) > 0.15);
    place(next, ev.rect);
    next.style.transitionDuration = cur.style.transitionDuration = fadeMs + 'ms';
    // Restart the drift animation on the incoming image.
    fg.style.animation = 'none'; void fg.offsetWidth; fg.style.animation = '';
    next.classList.add('on');
    cur.classList.remove('on');
    front = 1 - front;
    afterPaint(() => fe('painted', ev.chunk_id, performance.now() - received, ev.kind));
  }


  // ---------- Canvas mode ----------
  let mode = 'single';
  const tiles = new Map(); // element id → {div, url}
  function pct(v) { return (v * 100).toFixed(3) + '%'; }
  function setRect(div, r) { Object.assign(div.style, { left: pct(r.x), top: pct(r.y), width: pct(r.w), height: pct(r.h) }); }
  async function renderScene(sc) {
    const t0 = performance.now();
    const n = sc.elements.length;
    const keep = new Set(sc.elements.map(e => e.id));
    for (const [id, t] of tiles) if (!keep.has(id)) {           // removed → fade out
      t.div.classList.remove('on'); setTimeout(() => t.div.remove(), 450); tiles.delete(id);
    }
    const board = $('board');
    for (const e of sc.elements) {
      let t = tiles.get(e.id);
      if (!t) {
        const div = document.createElement('div'); div.className = 'tile';
        div.innerHTML = '<img class="bg"><img class="fg"><div class="ring"></div><div class="chip"></div>';
        setRect(div, e.rect); board.appendChild(div);
        t = { div, url: '' }; tiles.set(e.id, t);
      }
      const fg = t.div.querySelector('.fg'), bg = t.div.querySelector('.bg');
      if (t.url !== e.url) {
        const pre = new Image(); pre.src = e.url;
        try { await pre.decode(); } catch (_) {}
        fg.src = e.url; bg.src = e.url; t.url = e.url;
        if (shown[shown.length - 1] !== e.url && !shown.includes(e.url)) shown.push(e.url);
        if (e.focus && t.div.classList.contains('on')) { t.div.animate([{ filter: 'brightness(1.6)' }, { filter: 'none' }], { duration: 350 }); }
      }
      const full = n === 1;
      t.div.classList.toggle('full', full);
      const ia = (fg.naturalWidth || 16) / (fg.naturalHeight || 9), ta = (e.rect.w * innerWidth) / (e.rect.h * innerHeight);
      t.div.classList.toggle('fit', full && Math.abs(ia / ta - 1) > 0.15);
      t.div.classList.toggle('dim', sc.layout === 'hero' && !e.focus && n > 1);
      t.div.style.zIndex = e.focus ? 2 : 1;
      setRect(t.div, e.rect);
      requestAnimationFrame(() => t.div.classList.add('on'));
    }
    // annotations: highlight/frame on tiles (+ label chip), arrows as SVG paths between tile centres
    for (const [, t] of tiles) { t.div.classList.remove('hl', 'fr'); t.div.querySelector('.chip').classList.remove('on'); }
    const g = $('annG'); g.innerHTML = '';
    const byId = Object.fromEntries(sc.elements.map(e => [e.id, e]));
    for (const a of sc.annotations) {
      if (a.kind === 'arrow' && a.targets.length >= 2 && byId[a.targets[0]] && byId[a.targets[1]]) {
        const A = byId[a.targets[0]].rect, B = byId[a.targets[1]].rect;
        const ax = (A.x + A.w / 2) * innerWidth, ay = (A.y + A.h / 2) * innerHeight, bx = (B.x + B.w / 2) * innerWidth, by = (B.y + B.h / 2) * innerHeight;
        const mx = (ax + bx) / 2, my = Math.min(ay, by) - innerHeight * 0.08;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', `M${ax},${ay} Q${mx},${my} ${bx},${by}`); p.setAttribute('marker-end', 'url(#head)'); g.appendChild(p);
        if (a.label) { const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text'); tx.setAttribute('x', mx); tx.setAttribute('y', my); tx.setAttribute('text-anchor', 'middle'); tx.textContent = a.label; g.appendChild(tx); }
      } else {
        for (const id of a.targets) {
          const t = tiles.get(id); if (!t) continue;
          t.div.classList.add(a.kind === 'frame' ? 'fr' : 'hl');
          if (a.label) { const c = t.div.querySelector('.chip'); c.textContent = a.label; c.classList.add('on'); }
        }
      }
    }
    if (n) $('idle').classList.add('gone');
    afterPaint(() => fe('scene_painted', sc.chunk_id, performance.now() - t0, `v${sc.version} ${sc.reason}`));
  }
  listen('scene', e => { if (mode === 'canvas') renderScene(e.payload); });
  listen('state', e => applyState(e.payload));
  listen('talk_end', () => { toggleGrid(true); fe('grid', null, shown.length, 'talk_end'); });
  listen('render', e => { const t = performance.now(); fe('received', e.payload.chunk_id, 0, e.payload.kind); if (mode !== 'canvas') show(e.payload, t); });
  invoke('app_state').then(applyState).catch(() => {});
  fe('loaded', null, null, location.href);

  document.addEventListener('keydown', async e => {
    const w = window.__TAURI__.window.getCurrentWindow();
    if (e.key === 'b') { $('blank').classList.toggle('on'); fe('blank', null, null, String($('blank').classList.contains('on'))); }
    else if (e.key === 'g') toggleGrid(!$('grid').classList.contains('on'));
    else if (e.key === 'f') await w.setFullscreen(!(await w.isFullscreen()));
    else if (e.key === 'Escape') await w.setFullscreen(false);
  });
</script>
</body>
</html>
