[package]
name = "adlib"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = [] }
ls-contracts = { path = "../../crates/contracts" }
ls-pipeline = { path = "../../crates/pipeline" }
ls-canvas = { path = "../../crates/canvas" }
ls-hear = { path = "../../crates/hear" }
ls-search = { path = "../../crates/search" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
