[package]
name = "ls-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
hound = "3"
ls-contracts = { path = "../contracts" }
ls-hear = { path = "../hear" }
ls-search = { path = "../search" }
ls-query = { path = "../query" }
ls-decide = { path = "../decide" }
ls-stage = { path = "../stage" }
ls-canvas = { path = "../canvas" }
ls-agent = { path = "../agent" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
