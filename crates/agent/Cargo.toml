[package]
name = "ls-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
ls-canvas = { path = "../canvas" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
anyhow = "1"
